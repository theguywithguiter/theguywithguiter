name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: theguywithguiter
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339D353&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339D353&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D3533

      - name: Publish Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
